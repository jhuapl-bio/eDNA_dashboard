name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install flake8
      # Only fail on real errors: syntax errors + undefined names.
      - run: flake8 . --exclude=.venv,venv,api/venv --select=E9,F63,F7,F82 --show-source
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: for f in frontend/js/*.js frontend/config.example.js; do node --check "$f"; done
      - run: bash -n api/run.sh && bash -n frontend/make-config.sh

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.9", "3.12"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: pip }
      - run: pip install -r requirements-dev.txt
      - run: pytest
        env: { EDNA_LOG_FILE: "-" }

  example:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python ingest.py --example validate --strict
      - run: python build_mbon_html.py --example --validate
      - run: python build_mbon_html.py --example -o reports/example_report.html
      - uses: actions/upload-artifact@v4
        with:
          name: example-report
          path: |
            reports/example_report.html
            logs/
